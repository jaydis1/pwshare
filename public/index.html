<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Share - Secure Sharing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #2f3860 0%, #ac021f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 600px;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .icon {
      font-weight: bold;
      font-family: monospace;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 6px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      resize: vertical;
      min-height: 120px;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #2f3860;
      box-shadow: 0 0 0 3px rgba(47, 56, 96, 0.1);
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1.5px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      background: white;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      outline: none;
      border-color: #2f3860;
      box-shadow: 0 0 0 3px rgba(47, 56, 96, 0.1);
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1.5px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #2f3860;
      box-shadow: 0 0 0 3px rgba(47, 56, 96, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2f3860 0%, #ac021f 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(47, 56, 96, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .result-section {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      display: none;
    }

    .result-section.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      color: #666;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .share-link {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 12px;
      color: #2f3860;
    }

    .info-box {
      background: #e8f0ff;
      border-left: 4px solid #2f3860;
      padding: 12px;
      border-radius: 4px;
      color: #333;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 15px;
    }

    .error {
      background: #ffe8e8;
      border-left: 4px solid #ff6b6b;
      padding: 12px;
      border-radius: 4px;
      color: #c92a2a;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .success-message {
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
      padding: 12px;
      border-radius: 4px;
      color: #2e7d32;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .copy-button {
      background: white;
      border: 1px solid #2f3860;
      color: #2f3860;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
      width: 100%;
    }

    .copy-button:hover {
      background: #2f3860;
      color: white;
    }

    .copy-button.copied {
      background: #4caf50;
      border-color: #4caf50;
      color: white;
    }

    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .pastes-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .pastes-table thead {
      background: #f0f0f0;
    }

    .pastes-table th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      color: #333;
      border-bottom: 2px solid #e0e0e0;
    }

    .pastes-table td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 13px;
    }

    .pastes-table tr:hover {
      background: #f9f9f9;
    }

    .status-expired {
      color: #999;
      font-weight: 500;
    }

    .status-accessed {
      color: #4caf50;
      font-weight: 500;
    }

    .status-active {
      color: #2f3860;
      font-weight: 500;
    }

    .btn-delete {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .btn-delete:hover {
      background: #c92a2a;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Share View -->
    <div id="shareView" class="view active" style="display: block;">
      <h1><span class="icon">[#]</span> Password Share</h1>
      <p class="subtitle">Securely share passwords and sensitive data</p>

      <form id="shareForm">
        <div class="form-group">
          <label for="data">Paste your password or data:</label>
          <textarea
            id="data"
            placeholder="Enter the password, API key, or sensitive data you want to share..."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="expirationPreset">Expiration time:</label>
          <select id="expirationPreset">
            <option value="1h">1 hour</option>
            <option value="1d" selected>1 day</option>
            <option value="7d">7 days</option>
            <option value="custom">Custom hours</option>
          </select>
        </div>

        <div class="form-group" id="customHoursGroup" style="display: none;">
          <label for="customHours">Custom expiration (hours):</label>
          <input type="number" id="customHours" min="0.5" max="720" step="0.5" value="24" placeholder="Enter hours">
        </div>

        <div class="button-group">
          <button type="submit" class="btn-primary">
            <span id="submitText">Generate Share Link</span>
            <span id="loader" class="loader" style="display: none;"></span>
          </button>
          <button type="reset" class="btn-secondary">Clear</button>
        </div>

        <div class="error" id="error"></div>
        <div class="success-message" id="successMessage"></div>
      </form>

      <div class="result-section" id="resultSection">
        <div class="result-label">Share Link (one-time access):</div>
        <div class="share-link" id="shareLink"></div>
        <button class="copy-button" id="copyButton">Copy Link</button>
        <div class="info-box">
          [i] Share this link with someone. They can paste it in the browser to decrypt and view your data. The link will only work once and then expire.
        </div>
      </div>
    </div>

  </div>

  <script>
    // Crypto utilities using Web Crypto API
    class CryptoUtil {
      static async generateKey() {
        return await crypto.subtle.generateKey(
          { name: 'AES-GCM', length: 256 },
          true,
          ['encrypt', 'decrypt']
        );
      }

      static async encrypt(data, key) {
        const encoder = new TextEncoder();
        const dataBuffer = encoder.encode(data);
        const iv = crypto.getRandomValues(new Uint8Array(12));

        const encrypted = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          dataBuffer
        );

        return {
          ciphertext: btoa(String.fromCharCode(...new Uint8Array(encrypted))),
          iv: btoa(String.fromCharCode(...iv))
        };
      }

      static async exportKey(key) {
        const exported = await crypto.subtle.exportKey('raw', key);
        return btoa(String.fromCharCode(...new Uint8Array(exported)));
      }

      static async importKey(keyString) {
        const binaryString = atob(keyString);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        return await crypto.subtle.importKey(
          'raw',
          bytes,
          { name: 'AES-GCM', length: 256 },
          true,
          ['encrypt', 'decrypt']
        );
      }

      static async decrypt(encrypted, key) {
        const ciphertext = Uint8Array.from(atob(encrypted.ciphertext), c => c.charCodeAt(0));
        const iv = Uint8Array.from(atob(encrypted.iv), c => c.charCodeAt(0));

        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          ciphertext
        );

        const decoder = new TextDecoder();
        return decoder.decode(decrypted);
      }
    }

    // DOM elements
    const shareForm = document.getElementById('shareForm');
    const dataInput = document.getElementById('data');
    const expirationPreset = document.getElementById('expirationPreset');
    const customHoursGroup = document.getElementById('customHoursGroup');
    const customHours = document.getElementById('customHours');
    const resultSection = document.getElementById('resultSection');
    const shareLink = document.getElementById('shareLink');
    const copyButton = document.getElementById('copyButton');
    const errorDiv = document.getElementById('error');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = shareForm.querySelector('button[type="submit"]');
    const submitText = document.getElementById('submitText');
    const loader = document.getElementById('loader');

    // Show/hide custom hours
    expirationPreset.addEventListener('change', (e) => {
      customHoursGroup.style.display = e.target.value === 'custom' ? 'block' : 'none';
    });

    function getExpirationSeconds() {
      const preset = expirationPreset.value;
      if (preset === 'custom') {
        return parseInt(customHours.value) * 3600;
      }
      const expirations = { '1h': 3600, '1d': 86400, '7d': 604800 };
      return expirations[preset] || 86400;
    }

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareLink.textContent);
        copyButton.textContent = '[✓] Copied!';
        copyButton.classList.add('copied');
        setTimeout(() => {
          copyButton.textContent = 'Copy Link';
          copyButton.classList.remove('copied');
        }, 2000);
      } catch (err) {
        alert('Failed to copy to clipboard');
      }
    });

    shareForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.remove('show');
      successMessage.classList.remove('show');

      const data = dataInput.value.trim();
      if (!data) {
        errorDiv.textContent = 'Please enter some data to share';
        errorDiv.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitText.style.display = 'none';
      loader.style.display = 'inline-block';

      try {
        const key = await CryptoUtil.generateKey();
        const encrypted = await CryptoUtil.encrypt(data, key);
        const keyString = await CryptoUtil.exportKey(key);
        const expiresIn = getExpirationSeconds();

        const response = await fetch('/api/share', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ encrypted, expiresIn })
        });

        if (!response.ok) throw new Error('Failed to create share link');

        const result = await response.json();
        const shareUrl = `${window.location.origin}?share=${result.id}&key=${keyString}`;

        shareLink.textContent = shareUrl;
        resultSection.classList.add('show');
        shareForm.reset();
        customHoursGroup.style.display = 'none';

        successMessage.textContent = '[+] Share link created! The recipient can access it once.';
        successMessage.classList.add('show');

      } catch (err) {
        console.error(err);
        errorDiv.textContent = `Error: ${err.message}`;
        errorDiv.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitText.style.display = 'inline';
        loader.style.display = 'none';
      }
    });

    // Handle received share
    async function handleShareLink() {
      const params = new URLSearchParams(window.location.search);
      const shareId = params.get('share');
      const keyString = params.get('key');

      if (!shareId || !keyString) return;

      try {
        const key = await CryptoUtil.importKey(keyString);
        const response = await fetch(`/api/share/${shareId}`);

        if (!response.ok) throw new Error('Share not found or expired');

        const result = await response.json();
        const decrypted = await CryptoUtil.decrypt(result.encrypted, key);

        const html = `
          <h2 style="color: #333; margin-bottom: 15px;"><span class="icon">[i]</span> Shared Data</h2>
          <div style="background: white; padding: 16px; border-radius: 6px; border: 1px solid #e0e0e0; font-family: 'Monaco', 'Courier New', monospace; font-size: 13px; word-break: break-all; margin-bottom: 15px; max-height: 300px; overflow-y: auto;">
            ${escapeHtml(decrypted)}
          </div>
          <button onclick="copyToClipboard()" style="background: linear-gradient(135deg, #2f3860 0%, #ac021f 100%); color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Copy to Clipboard</button>
          <div style="background: #e8f5e9; border-left: 4px solid #4caf50; padding: 12px; border-radius: 4px; color: #2e7d32; font-size: 13px; margin-top: 15px;">
            [✓] Data decrypted in your browser. This share link will no longer work after this access.
          </div>
        `;

        document.querySelector('.container').innerHTML = html;
        window.decryptedData = decrypted;

      } catch (err) {
        alert('Error: ' + err.message);
        console.error(err);
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    window.copyToClipboard = async () => {
      try {
        await navigator.clipboard.writeText(window.decryptedData);
        alert('[+] Copied to clipboard!');
      } catch (err) {
        alert('Failed to copy');
      }
    };

    handleShareLink();
  </script>
</body>
</html>
