<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Password Share</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #2f3860 0%, #ac021f 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #2f3860;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #2f3860;
    }

    .controls {
      margin-bottom: 20px;
    }

    button {
      background: linear-gradient(135deg, #2f3860 0%, #ac021f 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-size: 14px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(47, 56, 96, 0.3);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #f8f9fa;
      border-bottom: 2px solid #e0e0e0;
    }

    th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 13px;
    }

    tr:hover {
      background: #f8f9fa;
    }

    .id-cell {
      font-family: 'Monaco', 'Courier New', monospace;
      color: #2f3860;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-accessed {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .badge-pending {
      background: #e3f2fd;
      color: #1565c0;
    }

    .badge-expired {
      background: #ffebee;
      color: #c62828;
    }

    .delete-btn {
      background: #ac021f;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: #8a0219;
      transform: translateY(-1px);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #ffebee;
      border: 1px solid #ef5350;
      color: #c62828;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span style="font-weight: bold; font-family: monospace;">[*]</span> Admin Panel</h1>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Total Pastes</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Pending Access</div>
        <div class="stat-value" id="pendingCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Already Accessed</div>
        <div class="stat-value" id="accessedCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Expired</div>
        <div class="stat-value" id="expiredCount">0</div>
      </div>
    </div>

    <div class="controls">
      <button onclick="loadPastes()">Refresh</button>
    </div>

    <div id="error"></div>

    <div class="table-wrapper">
      <div id="loading" class="loading">Loading pastes...</div>
      <div id="content" style="display: none;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Created</th>
              <th>Expires</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="pastesList">
          </tbody>
        </table>
        <div id="emptyState" class="empty-state">
          <div class="empty-state-icon">[—]</div>
          <div>No pastes yet</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadPastes() {
      const loading = document.getElementById('loading');
      const content = document.getElementById('content');
      const errorDiv = document.getElementById('error');
      const pastesList = document.getElementById('pastesList');
      const emptyState = document.getElementById('emptyState');

      loading.style.display = 'block';
      content.style.display = 'none';
      errorDiv.innerHTML = '';

      try {
        const response = await fetch('/api/admin/pastes');
        if (!response.ok) throw new Error('Failed to load pastes');

        const pastes = await response.json();

        const totalCount = pastes.length;
        const pendingCount = pastes.filter(p => !p.accessed && !p.expired).length;
        const accessedCount = pastes.filter(p => p.accessed && !p.expired).length;
        const expiredCount = pastes.filter(p => p.expired).length;

        document.getElementById('totalCount').textContent = totalCount;
        document.getElementById('pendingCount').textContent = pendingCount;
        document.getElementById('accessedCount').textContent = accessedCount;
        document.getElementById('expiredCount').textContent = expiredCount;

        if (pastes.length === 0) {
          emptyState.style.display = 'block';
          pastesList.innerHTML = '';
        } else {
          emptyState.style.display = 'none';
          pastesList.innerHTML = pastes.map(paste => {
            const created = new Date(paste.createdAt);
            const expires = new Date(paste.expiresAt);
            let statusBadge = '';

            if (paste.expired) {
              statusBadge = '<span class="badge badge-expired">[X] Expired</span>';
            } else if (paste.accessed) {
              statusBadge = '<span class="badge badge-accessed">[✓] Accessed</span>';
            } else {
              statusBadge = '<span class="badge badge-pending">[...] Pending</span>';
            }

            return `
              <tr>
                <td class="id-cell">${paste.id.substring(0, 8)}...</td>
                <td>${created.toLocaleString()}</td>
                <td>${expires.toLocaleString()}</td>
                <td>${statusBadge}</td>
                <td>
                  <button class="delete-btn" onclick="deletePaste('${paste.id}')">Delete</button>
                </td>
              </tr>
            `;
          }).join('');
        }

        loading.style.display = 'none';
        content.style.display = 'block';
      } catch (err) {
        errorDiv.innerHTML = `<div class="error">Error: ${err.message}</div>`;
        loading.style.display = 'none';
      }
    }

    async function deletePaste(id) {
      if (!confirm('Are you sure you want to delete this paste?')) return;

      try {
        const response = await fetch(`/api/admin/pastes/${id}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Failed to delete paste');
        loadPastes();
      } catch (err) {
        document.getElementById('error').innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }

    loadPastes();

    setInterval(loadPastes, 5000);
  </script>
</body>
</html>
