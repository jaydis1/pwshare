<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Password Share</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #2f3860 0%, #ac021f 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); width: 100%; max-width: 600px; padding: 40px; }
    h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .icon { font-weight: bold; font-family: monospace; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input[type="password"] { width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
    input[type="password"]:focus { outline: none; border-color: #2f3860; box-shadow: 0 0 0 3px rgba(47, 56, 96, 0.1); }
    button { width: 100%; padding: 12px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: linear-gradient(135deg, #2f3860 0%, #ac021f 100%); color: white; }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(47, 56, 96, 0.3); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #ffe8e8; border-left: 4px solid #ff6b6b; padding: 12px; border-radius: 4px; color: #c92a2a; font-size: 13px; margin-bottom: 15px; display: none; }
    .error.show { display: block; }
    .admin-content { display: none; }
    .admin-content.show { display: block; }
    .auth-form { display: block; }
    .auth-form.hide { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e0e0e0; }
    .logout-btn { width: auto; padding: 8px 16px; font-size: 12px; background: #f0f0f0; color: #333; }
    .logout-btn:hover { background: #e0e0e0; transform: none; box-shadow: none; }
    .pastes-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .pastes-table thead { background: #f0f0f0; }
    .pastes-table th { padding: 12px; text-align: left; font-weight: 600; font-size: 12px; color: #333; border-bottom: 2px solid #e0e0e0; }
    .pastes-table td { padding: 12px; border-bottom: 1px solid #e0e0e0; font-size: 13px; }
    .pastes-table tr:hover { background: #f9f9f9; }
    .status-expired { color: #999; font-weight: 500; }
    .status-accessed { color: #4caf50; font-weight: 500; }
    .status-active { color: #2f3860; font-weight: 500; }
    .btn-delete { background: #ff6b6b; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600; width: auto; }
    .btn-delete:hover { background: #c92a2a; transform: none; }
    .empty-state { text-align: center; padding: 40px 20px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="auth-form">
      <h1><span class="icon">[*]</span> Admin Panel</h1>
      <p class="subtitle">Enter password to access</p>
      <div class="error" id="error"></div>
      <form id="authForm">
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" placeholder="Enter admin password" required>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>

    <div class="admin-content">
      <div class="header">
        <h1><span class="icon">[*]</span> Admin Panel</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
      <p class="subtitle">Manage all active shares</p>
      <div id="pastesList"></div>
    </div>
  </div>

  <script>
    const authForm = document.querySelector('.auth-form');
    const adminContent = document.querySelector('.admin-content');
    const errorDiv = document.getElementById('error');
    const passwordInput = document.getElementById('password');

    function checkAuth() {
      const token = sessionStorage.getItem('admin_token');
      if (token) {
        authForm.classList.add('hide');
        adminContent.classList.add('show');
        loadPastes();
      }
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.remove('show');
      const password = passwordInput.value;
      try {
        const response = await fetch('/api/admin/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (!response.ok) throw new Error('Invalid password');
        const result = await response.json();
        sessionStorage.setItem('admin_token', result.token);
        authForm.classList.add('hide');
        adminContent.classList.add('show');
        loadPastes();
      } catch (err) {
        errorDiv.textContent = 'Error: ' + err.message;
        errorDiv.classList.add('show');
        passwordInput.value = '';
      }
    });

    async function loadPastes() {
      try {
        const token = sessionStorage.getItem('admin_token');
        const response = await fetch('/api/admin/pastes', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!response.ok) {
          if (response.status === 401) {
            sessionStorage.removeItem('admin_token');
            location.reload();
          }
          throw new Error('Failed to load pastes');
        }
        const pastes = await response.json();
        const pastesList = document.getElementById('pastesList');
        if (pastes.length === 0) {
          pastesList.innerHTML = '<div class="empty-state">No active shares</div>';
          return;
        }
        let html = '<table class="pastes-table"><thead><tr><th>ID</th><th>Created</th><th>Expires</th><th>Status</th><th>Action</th></tr></thead><tbody>';
        pastes.forEach(paste => {
          const expiresAt = new Date(paste.expiresAt);
          let statusClass = 'status-active';
          let statusText = 'Active';
          if (paste.expired) { statusClass = 'status-expired'; statusText = 'Expired'; }
          else if (paste.accessed) { statusClass = 'status-accessed'; statusText = 'Accessed'; }
          const created = new Date(paste.createdAt).toLocaleString();
          const expires = expiresAt.toLocaleString();
          const shortId = paste.id.substring(0, 8);
          html += '<tr><td><code>' + shortId + '...</code></td><td>' + created + '</td><td>' + expires + '</td><td><span class="' + statusClass + '">' + statusText + '</span></td><td><button class="btn-delete" onclick="deletePaste(\'' + paste.id + '\')">Delete</button></td></tr>';
        });
        html += '</tbody></table>';
        pastesList.innerHTML = html;
      } catch (err) {
        console.error(err);
      }
    }

    window.deletePaste = async (id) => {
      if (!confirm('Delete this share?')) return;
      try {
        const token = sessionStorage.getItem('admin_token');
        const response = await fetch('/api/admin/pastes/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!response.ok) throw new Error('Failed to delete');
        loadPastes();
      } catch (err) {
        alert('Error deleting paste: ' + err.message);
      }
    };

    window.logout = () => {
      sessionStorage.removeItem('admin_token');
      location.reload();
    };

    checkAuth();
  </script>
</body>
</html>
